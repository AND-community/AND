name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    name: AND (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Bağımlılıkları indir
        run: go mod download

      - name: Derle
        run: go build ./...

      - name: Testleri çalıştır
        run: go test ./...

      - name: Statik analiz
        run: go vet ./...

      # Biçim ve açık denetimleri işletim sisteminden bağımsız; bir kez yeter.
      - name: Biçim denetimi
        if: runner.os == 'Linux'
        run: |
          fark="$(gofmt -l .)"
          if [ -n "$fark" ]; then
            echo "::error::gofmt'e uymayan dosyalar (gofmt -w ile düzelt):"
            echo "$fark"
            exit 1
          fi

      - name: Bilinen açık taraması
        if: runner.os == 'Linux'
        run: bash .github/scripts/govulncheck.sh

      # Üçüncü taraf lisans bildirimleri go.mod'dan üretilir. Bağımlılık değişip
      # bildirim yenilenmediyse internal/lisans testleri de kırılır; bu adım
      # depodaki dosyaların üreticinin çıktısıyla bire bir aynı olduğunu doğrular.
      - name: Lisans bildirimleri güncel mi
        if: runner.os == 'Linux'
        run: |
          go generate ./internal/lisans
          if ! git diff --quiet -- internal/lisans; then
            echo "::error::Lisans bildirimleri güncel değil; 'go generate ./internal/lisans' çalıştırıp sonucu ekle"
            git diff --stat -- internal/lisans
            exit 1
          fi

  # Veri yarışlarını arar. -race cgo ister; Linux koşucusunda gcc hazır.
  race:
    name: AND yarış testi
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Yarış testiyle çalıştır
        run: go test -race -count=1 ./...

  and-vscode:
    name: and-vscode (typecheck/build/test)
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: and-vscode/package-lock.json

      - name: Bağımlılıkları kur
        working-directory: and-vscode
        run: npm ci

      - name: Tip kontrolü
        working-directory: and-vscode
        run: npm run typecheck

      - name: Derle
        working-directory: and-vscode
        run: npm run build

      - name: Testleri çalıştır
        working-directory: and-vscode
        run: npm test
