name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Binary derle (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Binary derle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.ref_name }}"
          # Güncelleyicinin sürüm aradığı depo: bu iş akışının çalıştığı depo.
          # github.com/lucian95511/and modül yoludur, depo adı değildir.
          REPO="${{ github.repository }}"
          LDFLAGS="-s -w \
            -X github.com/lucian95511/and/internal/updater.Version=${VERSION} \
            -X github.com/lucian95511/and/internal/updater.GitHubRepo=${REPO}"

          # İsteğe bağlı sürüm imzası: depodaki ed25519 genel anahtarı (gizli
          # değildir) derlemeye gömülür; o zaman otomatik güncelleme
          # SHA256SUMS.txt.sig doğrulanmadan hiçbir güncellemeyi uygulamaz.
          # Kurulum için aşağıdaki "Özet dosyasını imzala" adımına bak.
          PUBKEY_FILE=".github/update-signing-pubkey.hex"
          if [ -f "${PUBKEY_FILE}" ]; then
            PUBKEY_HEX="$(tr -d '[:space:]' < "${PUBKEY_FILE}")"
            if ! printf '%s' "${PUBKEY_HEX}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "::error file=${PUBKEY_FILE}::64 hex karakterlik bir ed25519 genel anahtarı olmalı"
              exit 1
            fi
            LDFLAGS="${LDFLAGS} -X github.com/lucian95511/and/internal/updater.UpdateSigningKeyHex=${PUBKEY_HEX}"
          fi

          SUFFIX="${{ matrix.suffix }}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          # Ana uygulama
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and_${OS}_${ARCH}${SUFFIX}" \
            ./cmd/and

          # Moderasyon CLI
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "andmod_${OS}_${ARCH}${SUFFIX}" \
            ./cmd/andmod

          # Eklenti binary'leri, "klasör:ad" çiftleri. Ad, eklentinin
          # plugin.json'daki name alanıdır; AND eklentiyi bu adla bulur.
          # DeltaX, Pembis ve konu_ac ayrı depolardır (alt modül); klasörü
          # olmayan eklenti tüm yayını durdurmaz, uyarıyla atlanır.
          for e in admin:admin konu_ac:konu_ac ozel_chat:ozel_chat DeltaX:DeltaX Pembis:pembis site:site; do
            klasor="${e%%:*}"
            ad="${e##*:}"
            if [ ! -f "Eklentiler/${klasor}/plugin.json" ]; then
              echo "::warning::Eklentiler/${klasor} depoda yok; and-plugin-${ad} bu sürümde yayınlanmıyor."
              continue
            fi
            go build -trimpath -ldflags "${LDFLAGS}" \
              -o "and-plugin-${ad}_${OS}_${ARCH}${SUFFIX}" \
              "./Eklentiler/${klasor}"
            # Sidecar manifest: AND eklenti bilgisini binary'i çalıştırmadan okur.
            cp "Eklentiler/${klasor}/plugin.json" "and-plugin-${ad}.json"
          done

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            and_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            andmod_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-*
          if-no-files-found: ignore

  release:
    name: GitHub Release oluştur
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Artifact'leri indir
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      # MIT, BSD ve Apache lisansları ikili dağıtımda lisans bildirimlerinin de
      # verilmesini ister; AND'ın kendi lisansı ve üçüncü taraf bildirimleri
      # ikili dosyaların yanında yayımlanır ve imzalı özet dosyasına girer.
      - name: Lisans dosyalarını ekle
        run: |
          cp LICENSE dist/LICENSE.txt
          cp internal/lisans/ucuncu_taraf.txt dist/THIRD_PARTY_NOTICES.txt

      - name: SHA256 özet dosyası oluştur
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # İsteğe bağlı sürüm imzası. Açmak için bir kez:
      #   openssl genpkey -algorithm ed25519 -out imza.pem
      #   openssl pkey -in imza.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n' > .github/update-signing-pubkey.hex
      # .hex dosyasını depoya ekle, imza.pem'in içeriğini UPDATE_SIGNING_KEY
      # sırrı olarak tanımla ve imza.pem'i depo dışında güvenle sakla.
      # Genel anahtar dosyası varken sır eksikse ya da başka bir anahtarsa
      # sürüm durdurulur: o anahtarı gömülü taşıyan istemciler imzasız bir
      # sürüme hiç güncellenemezdi.
      - name: Özet dosyasını imzala
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          PUBKEY_FILE=".github/update-signing-pubkey.hex"
          if [ ! -f "${PUBKEY_FILE}" ]; then
            echo "Sürüm imzası kapalı (${PUBKEY_FILE} yok); özet dosyası imzalanmadan yayınlanıyor."
            exit 0
          fi
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::error::${PUBKEY_FILE} var ama UPDATE_SIGNING_KEY sırrı tanımlı değil"
            exit 1
          fi
          umask 077
          KEY="${RUNNER_TEMP}/imza.pem"
          trap 'rm -f "${KEY}"' EXIT
          printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${KEY}"
          GERCEK="$(openssl pkey -in "${KEY}" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          BEKLENEN="$(tr -d '[:space:]' < "${PUBKEY_FILE}" | tr 'A-F' 'a-f')"
          if [ "${GERCEK}" != "${BEKLENEN}" ]; then
            echo "::error::UPDATE_SIGNING_KEY, ${PUBKEY_FILE} içindeki genel anahtarla eşleşmiyor"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "${KEY}" -rawin -in dist/SHA256SUMS.txt -out dist/SHA256SUMS.txt.sig
          test "$(wc -c < dist/SHA256SUMS.txt.sig)" -eq 64

      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          name: "AND ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/and_*
            dist/andmod_*
            dist/and-plugin-*
            dist/*.json
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
