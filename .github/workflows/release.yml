name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Binary derle (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Go kur
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Binary derle
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ github.ref_name }}"
          REPO="lucian95511/and"
          LDFLAGS="-s -w \
            -X github.com/lucian95511/and/internal/updater.Version=${VERSION} \
            -X github.com/lucian95511/and/internal/updater.GitHubRepo=${REPO}"

          # İsteğe bağlı sürüm imzası: depodaki ed25519 genel anahtarı (gizli
          # değildir) derlemeye gömülür; o zaman otomatik güncelleme
          # SHA256SUMS.txt.sig doğrulanmadan hiçbir güncellemeyi uygulamaz.
          # Kurulum için aşağıdaki "Özet dosyasını imzala" adımına bak.
          PUBKEY_FILE=".github/update-signing-pubkey.hex"
          if [ -f "${PUBKEY_FILE}" ]; then
            PUBKEY_HEX="$(tr -d '[:space:]' < "${PUBKEY_FILE}")"
            if ! printf '%s' "${PUBKEY_HEX}" | grep -Eq '^[0-9a-fA-F]{64}$'; then
              echo "::error file=${PUBKEY_FILE}::64 hex karakterlik bir ed25519 genel anahtarı olmalı"
              exit 1
            fi
            LDFLAGS="${LDFLAGS} -X github.com/lucian95511/and/internal/updater.UpdateSigningKeyHex=${PUBKEY_HEX}"
          fi

          SUFFIX="${{ matrix.suffix }}"
          OS="${{ matrix.goos }}"
          ARCH="${{ matrix.goarch }}"

          # Ana uygulama
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and_${OS}_${ARCH}${SUFFIX}" \
            ./cmd/and

          # Moderasyon CLI
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "andmod_${OS}_${ARCH}${SUFFIX}" \
            ./cmd/andmod

          # Eklenti binary'leri
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-admin_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/admin

          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-konu-ac_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/konu_ac

          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-ozel-chat_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/ozel_chat

          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-DeltaX_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/DeltaX

          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-pembis_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/Pembis

          go build -trimpath -ldflags "${LDFLAGS}" \
            -o "and-plugin-site_${OS}_${ARCH}${SUFFIX}" \
            ./Eklentiler/site

          # Sidecar manifest JSON dosyaları — AND bu dosyaları okuyarak
          # binary'i çalıştırmadan eklenti bilgisini alır (XenForo addon.json gibi).
          cp Eklentiler/admin/plugin.json     and-plugin-admin.json
          cp Eklentiler/konu_ac/plugin.json   and-plugin-konu-ac.json
          cp Eklentiler/ozel_chat/plugin.json and-plugin-ozel-chat.json
          cp Eklentiler/DeltaX/plugin.json    and-plugin-DeltaX.json
          cp Eklentiler/Pembis/plugin.json    and-plugin-pembis.json
          cp Eklentiler/site/plugin.json      and-plugin-site.json

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            and_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            andmod_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-admin_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-konu-ac_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-ozel-chat_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-DeltaX_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-pembis_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-site_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.suffix }}
            and-plugin-admin.json
            and-plugin-konu-ac.json
            and-plugin-ozel-chat.json
            and-plugin-DeltaX.json
            and-plugin-pembis.json
            and-plugin-site.json
          if-no-files-found: ignore

  release:
    name: GitHub Release oluştur
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Artifact'leri indir
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: SHA256 özet dosyası oluştur
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # İsteğe bağlı sürüm imzası. Açmak için bir kez:
      #   openssl genpkey -algorithm ed25519 -out imza.pem
      #   openssl pkey -in imza.pem -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n' > .github/update-signing-pubkey.hex
      # .hex dosyasını depoya ekle, imza.pem'in içeriğini UPDATE_SIGNING_KEY
      # sırrı olarak tanımla ve imza.pem'i depo dışında güvenle sakla.
      # Genel anahtar dosyası varken sır eksikse ya da başka bir anahtarsa
      # sürüm durdurulur: o anahtarı gömülü taşıyan istemciler imzasız bir
      # sürüme hiç güncellenemezdi.
      - name: Özet dosyasını imzala
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          PUBKEY_FILE=".github/update-signing-pubkey.hex"
          if [ ! -f "${PUBKEY_FILE}" ]; then
            echo "Sürüm imzası kapalı (${PUBKEY_FILE} yok); özet dosyası imzalanmadan yayınlanıyor."
            exit 0
          fi
          if [ -z "${UPDATE_SIGNING_KEY}" ]; then
            echo "::error::${PUBKEY_FILE} var ama UPDATE_SIGNING_KEY sırrı tanımlı değil"
            exit 1
          fi
          umask 077
          KEY="${RUNNER_TEMP}/imza.pem"
          trap 'rm -f "${KEY}"' EXIT
          printf '%s\n' "${UPDATE_SIGNING_KEY}" > "${KEY}"
          GERCEK="$(openssl pkey -in "${KEY}" -pubout -outform DER | tail -c 32 | od -An -tx1 | tr -d ' \n')"
          BEKLENEN="$(tr -d '[:space:]' < "${PUBKEY_FILE}" | tr 'A-F' 'a-f')"
          if [ "${GERCEK}" != "${BEKLENEN}" ]; then
            echo "::error::UPDATE_SIGNING_KEY, ${PUBKEY_FILE} içindeki genel anahtarla eşleşmiyor"
            exit 1
          fi
          openssl pkeyutl -sign -inkey "${KEY}" -rawin -in dist/SHA256SUMS.txt -out dist/SHA256SUMS.txt.sig
          test "$(wc -c < dist/SHA256SUMS.txt.sig)" -eq 64

      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          name: "AND ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/and_*
            dist/andmod_*
            dist/and-plugin-*
            dist/*.json
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig
